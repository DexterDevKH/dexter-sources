name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows: ["Update SideStore Source", "Keep Workflows Alive", "pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
        run: |
          echo "::group::🧹 Auto-Purging Completed Workflow Runs"
          # Disable immediate exit on non-zero exit code so 404s or missing items never fail the job
          set +e

          CURRENT_RUN="${{ github.run_id }}"

          # Function to purge older completed runs for a specific workflow (keeps the 1 newest run)
          purge_workflow() {
            local wf="$1"
            echo "Checking completed runs of $wf..."
            local run_ids
            run_ids=$(gh run list --repo "${{ github.repository }}" --workflow="$wf" --status=completed -L 150 --json databaseId -q '.[].databaseId' 2>/dev/null)

            local count
            count=$(echo "$run_ids" | grep -c . || true)

            if [ -z "$run_ids" ] || [ "$count" -le 1 ]; then
              echo "  Found $count completed run(s) for $wf. Keeping it."
              return
            fi

            local newest_id
            newest_id=$(echo "$run_ids" | head -n 1)
            echo "  Preserving newest run: $newest_id"

            # Delete older runs starting from the 2nd newest
            echo "$run_ids" | tail -n +2 | while read -r rid; do
              if [ -n "$rid" ] && [ "$rid" != "$CURRENT_RUN" ]; then
                echo "  Deleting older run $rid ($wf)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
              fi
            done
          }

          # Purge older runs for each workflow (keeping the 1 newest run of each)
          purge_workflow "update-sources.yml"
          purge_workflow "keep-alive.yml"
          purge_workflow "pages-build-deployment"
          purge_workflow "cleanup-workflows.yml"

          echo "✔ Complete: Retained the newest run for each workflow and purged older history."
          echo "::endgroup::"
          exit 0
