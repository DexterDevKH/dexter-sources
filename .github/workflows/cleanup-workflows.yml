name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows: ["Update SideStore Source", "Keep Workflows Alive", "pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::group::🧹 Auto-Purging Completed Workflow Runs"
          # If triggered by workflow_run, target the completed run ID directly
          if [ -n "$TARGET_RUN_ID" ]; then
            echo "Deleting completed trigger run: $TARGET_RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$TARGET_RUN_ID" || true
          fi

          # Purge any remaining completed runs of update-sources.yml
          echo "Purging all completed runs of update-sources.yml..."
          gh run list --repo "${{ github.repository }}" --workflow=update-sources.yml --status=completed -L 100 --json databaseId -q '.[].databaseId' | while read -r rid; do
            if [ -n "$rid" ]; then
              echo "Deleting completed update-sources.yml run $rid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" || true
            fi
          done

          # Purge any remaining completed runs of keep-alive.yml
          echo "Purging all completed runs of keep-alive.yml..."
          gh run list --repo "${{ github.repository }}" --workflow=keep-alive.yml --status=completed -L 100 --json databaseId -q '.[].databaseId' | while read -r rid; do
            if [ -n "$rid" ]; then
              echo "Deleting completed keep-alive.yml run $rid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" || true
            fi
          done

          # Purge any remaining completed runs of pages-build-deployment
          echo "Purging all completed runs of pages-build-deployment..."
          gh run list --repo "${{ github.repository }}" --workflow=pages-build-deployment --status=completed -L 100 --json databaseId -q '.[].databaseId' 2>/dev/null | while read -r rid; do
            if [ -n "$rid" ]; then
              echo "Deleting completed pages-build-deployment run $rid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" || true
            fi
          done

          # Purge past completed runs of this cleanup workflow itself
          echo "Purging past completed runs of cleanup workflow..."
          CURRENT_RUN="${{ github.run_id }}"
          for wf in cleanup-workflows.yml cleanup.yml; do
            gh run list --repo "${{ github.repository }}" --workflow="$wf" --status=completed -L 100 --json databaseId -q '.[].databaseId' 2>/dev/null | while read -r crid; do
              if [ -n "$crid" ] && [ "$crid" != "$CURRENT_RUN" ]; then
                echo "Deleting old cleanup run $crid"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$crid" || true
              fi
            done
          done

          echo "✔ Complete: All completed run logs and history have been purged."
          echo "::endgroup::"
