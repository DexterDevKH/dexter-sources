name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows: ["Update SideStore Source", "Keep Workflows Alive", "pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::group::🧹 Auto-Purging Completed Workflow Runs"
          # Disable immediate exit on non-zero exit code so 404s or missing items never fail the job
          set +e

          CURRENT_RUN="${{ github.run_id }}"

          # If triggered by workflow_run, delete the trigger run directly
          if [ -n "$TARGET_RUN_ID" ]; then
            echo "Deleting trigger run: $TARGET_RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$TARGET_RUN_ID" >/dev/null 2>&1 || true
          fi

          # Function to purge completed runs for a specific workflow
          purge_workflow() {
            local wf="$1"
            echo "Purging completed runs of $wf..."
            gh run list --repo "${{ github.repository }}" --workflow="$wf" --status=completed -L 100 --json databaseId -q '.[].databaseId' 2>/dev/null | while read -r rid; do
              if [ -n "$rid" ] && [ "$rid" != "$CURRENT_RUN" ]; then
                echo "Deleting run $rid ($wf)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
              fi
            done
          }

          # Purge runs for individual workflows
          purge_workflow "update-sources.yml"
          purge_workflow "keep-alive.yml"
          purge_workflow "pages-build-deployment"
          purge_workflow "cleanup-workflows.yml"

          # Final sweep for any remaining completed runs across repository
          echo "Sweeping any remaining completed runs in repository..."
          gh run list --repo "${{ github.repository }}" --status=completed -L 100 --json databaseId -q '.[].databaseId' 2>/dev/null | while read -r rid; do
            if [ -n "$rid" ] && [ "$rid" != "$CURRENT_RUN" ]; then
              echo "Deleting remaining run $rid"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
            fi
          done

          echo "✔ Complete: All completed run logs and history have been purged."
          echo "::endgroup::"
          exit 0
