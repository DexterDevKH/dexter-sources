name: Auto-Purge Completed Workflow Runs

on:
  workflow_run:
    workflows: ["Update SideStore Source", "Keep Workflows Alive", "pages-build-deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-runs:
    name: Auto-Purge Run Logs & History
    runs-on: ubuntu-latest
    steps:
      - name: Purge Completed Workflow Runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_NO_PROMPT: "1"
        run: |
          echo "::group::🧹 Auto-Purging Completed Workflow Runs"
          # Disable immediate exit on non-zero exit code so 404s or missing items never fail the job
          set +e

          CURRENT_RUN="${{ github.run_id }}"
          KEEP_COUNT=3

          # Function to purge older completed runs for a workflow (keeps up to KEEP_COUNT runs)
          purge_workflow() {
            local wf="$1"
            local keep="${2:-$KEEP_COUNT}"
            echo "Checking completed runs of $wf (keeping up to $keep)..."
            local run_ids
            run_ids=$(gh run list --repo "${{ github.repository }}" --workflow="$wf" --status=completed -L 150 --json databaseId -q '.[].databaseId' 2>/dev/null)

            local count
            count=$(echo "$run_ids" | grep -c . || true)

            if [ -z "$run_ids" ] || [ "$count" -le "$keep" ]; then
              echo "  Found $count completed run(s) for $wf. No older runs to purge."
              return
            fi

            local start_line=$((keep + 1))
            echo "  Preserving newest $keep run(s); purging older runs starting from index $start_line..."

            echo "$run_ids" | tail -n +"$start_line" | while read -r rid; do
              if [ -n "$rid" ] && [ "$rid" != "$CURRENT_RUN" ]; then
                echo "  Deleting older run $rid ($wf)"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
              fi
            done
          }

          # 1. Purge older runs for external workflows (keeping 3 newest of each)
          purge_workflow "update-sources.yml" "$KEEP_COUNT"
          purge_workflow "keep-alive.yml" "$KEEP_COUNT"
          purge_workflow "pages-build-deployment" "$KEEP_COUNT"

          # 2. Purge past completed runs of cleanup workflow
          # (Since CURRENT_RUN will finish and become 1 of the 3 runs, keep KEEP_COUNT - 1 past runs)
          CLEANUP_PAST_KEEP=$((KEEP_COUNT > 1 ? KEEP_COUNT - 1 : 0))
          echo "Purging past completed runs of cleanup-workflows.yml (keeping $CLEANUP_PAST_KEEP past runs + 1 active)..."
          cleanup_ids=$(gh run list --repo "${{ github.repository }}" --workflow=cleanup-workflows.yml --status=completed -L 150 --json databaseId -q '.[].databaseId' 2>/dev/null)
          cleanup_count=$(echo "$cleanup_ids" | grep -c . || true)

          if [ -n "$cleanup_ids" ] && [ "$cleanup_count" -gt "$CLEANUP_PAST_KEEP" ]; then
            cleanup_start_line=$((CLEANUP_PAST_KEEP + 1))
            echo "$cleanup_ids" | tail -n +"$cleanup_start_line" | while read -r rid; do
              if [ -n "$rid" ] && [ "$rid" != "$CURRENT_RUN" ]; then
                echo "  Deleting past cleanup run $rid"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 || true
              fi
            done
          else
            echo "  Found $cleanup_count past completed run(s) for cleanup-workflows.yml. No older runs to purge."
          fi

          echo "✔ Complete: Retained up to $KEEP_COUNT runs for each workflow and purged older history."
          echo "::endgroup::"
          exit 0
